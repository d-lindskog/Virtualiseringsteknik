- hosts: all
  become: yes
  roles:
    - common

- name: Persistent routing på kontroll, DMZ och backend
  hosts: control:dmz:backend
  become: true
  roles:
    - routes

- hosts: gateway
  become: yes
  roles:
    - firewall

- name: Konfigurera webserver i DMZ
  hosts: webserver
  become: yes
  roles:
    - webserver

- name: Konfigurera Keycloak i DMZ
  hosts: keycloak
  become: yes
  roles:
    - keycloak
    