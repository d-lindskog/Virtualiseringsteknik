---
# Grundinstallation för webservern i DMZ.
# Installerar paket som behövs för nginx och en senare Flask-applikation.

- name: Installera nödvändiga paket för webservern
  apt:
    name:
      - python3
      - python3-flask
      - python3-pip
      - nginx
    state: present
    update_cache: true

# Skapar en tydlig plats där Flask-applikationen senare kan läggas.

- name: Skapa katalog för Flask-applikation
  file:
    path: /opt/webapp
    state: directory
    owner: vagrant
    group: vagrant
    mode: "0755"

# Kopierar Flask-applikationen från Ansible till webservern

- name: Kopiera Flask-app till servern
  copy:
    src: app.py
    dest: /opt/webapp/app.py

 # Skapar systemd-service för Flask-applikationen

- name: Skapa systemd-service för Flask-app
  template:
    src: webapp.service.j2
    dest: /etc/systemd/system/webapp.service

    # Laddar om systemd så den hittar den nya webapp-servicen

- name: Ladda om systemd
  command: systemctl daemon-reload

# Startar Flask-appen som bakgrundstjänst

- name: Starta och aktivera Flask-app
  service:
    name: webapp
    state: started
    enabled: true   

# Startar nginx så webservern är igång och aktiveras vid omstart.

- name: Starta och aktivera nginx
  service:
    name: nginx
    state: started
    enabled: true
