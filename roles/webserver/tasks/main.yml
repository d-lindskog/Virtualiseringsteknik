---
# Grundinstallation för webservern i DMZ.
# Installerar paket som behövs för nginx och en senare Flask-applikation.

- name: Installera nödvändiga paket för webservern
  apt:
    name:
      - python3
      - python3-flask
      - python3-requests
      - python3-pip
      - nginx
    state: present
    update_cache: true

# Skapar en tydlig plats där Flask-applikationen senare kan läggas.

- name: Skapa katalog för Flask-applikation
  file:
    path: /opt/webapp
    state: directory
    owner: vagrant
    group: vagrant
    mode: "0755"

# Lägger ut Flask-applikationen från en template så Keycloak-variabler kan användas.

- name: Lägg ut Flask-app från template
  template:
    src: app.py.j2
    dest: "{{ webapp_dir }}/app.py"
    owner: "{{ webapp_user }}"
    group: "{{ webapp_group }}"
    mode: "0644"

 # Skapar systemd-service för Flask-applikationen

- name: Skapa systemd-service för Flask-app
  template:
    src: webapp.service.j2
    dest: /etc/systemd/system/webapp.service

    # Laddar om systemd så den hittar den nya webapp-servicen

- name: Ladda om systemd
  command: systemctl daemon-reload

# Startar Flask-appen som bakgrundstjänst

- name: Starta och aktivera Flask-app
  service:
    name: webapp
    state: started
    enabled: true   
# Lägger ut nginx-konfiguration för Flask-applikationen.

- name: Lägg ut nginx-konfiguration för webappen
  template:
    src: webapp.nginx.j2
    dest: /etc/nginx/sites-available/webapp

# Aktiverar nginx-siten genom symbolisk länk.

- name: Aktivera nginx-site
  file:
    src: /etc/nginx/sites-available/webapp
    dest: /etc/nginx/sites-enabled/webapp
    state: link

# Tar bort default-siten så vår webapp används.

- name: Ta bort default nginx-site
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent
    
# Startar nginx så webservern är igång och aktiveras vid omstart.

- name: Starta och aktivera nginx
  service:
    name: nginx
    state: restarted
    enabled: true
