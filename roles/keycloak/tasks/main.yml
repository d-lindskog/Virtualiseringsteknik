---
# Grundinstallation för Keycloak i DMZ.
# Installerar Java och verktyg som krävs för Keycloak.

- name: Installera nödvändiga paket för Keycloak
  apt:
    name:
      - openjdk-17-jdk
      - unzip
    state: present
    update_cache: true

# Laddar ner Keycloak från GitHub releases.

- name: Ladda ner Keycloak
  get_url:
    url: https://github.com/keycloak/keycloak/releases/download/24.0.4/keycloak-24.0.4.zip
    dest: /tmp/keycloak.zip

# Packar upp Keycloak under /opt.

- name: Extrahera Keycloak
  unarchive:
    src: /tmp/keycloak.zip
    dest: /opt/
    remote_src: true

# Skapar en tydlig sökväg till installationen.

- name: Skapa symbolisk länk till Keycloak
  file:
    src: /opt/keycloak-24.0.4
    dest: /opt/keycloak
    state: link

# Ger vagrant-användaren rättigheter till Keycloak-katalogen.

- name: Sätt ägare på Keycloak-katalogen
  file:
    path: /opt/keycloak-24.0.4
    owner: vagrant
    group: vagrant
    recurse: true

# Skapar systemd-service för Keycloak.

- name: Skapa systemd-service för Keycloak
  template:
    src: keycloak.service.j2
    dest: /etc/systemd/system/keycloak.service
    owner: root
    group: root
    mode: "0644"

# Laddar om systemd så den hittar Keycloak-servicen.

- name: Ladda om systemd
  command: systemctl daemon-reload

# Startar och aktiverar Keycloak.

- name: Starta och aktivera Keycloak
  service:
    name: keycloak
    state: started
    enabled: true
    